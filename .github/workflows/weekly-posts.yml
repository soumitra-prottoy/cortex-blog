name: Weekly Blog Posts

on:
  schedule:
    # Every Tuesday at 9:00 AM Bangladesh Time (UTC+6) = 3:00 AM UTC
    - cron: '0 3 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate weekly posts
        run: node scripts/weekly-posts.js
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Generate thumbnails for new posts
        run: python3 scripts/gen_thumbnails.py --all public/thumbnails/

      - name: Commit and push
        run: |
          git config user.name "Cortex Bot"
          git config user.email "cortex@bot.local"
          git add -A
          git diff --staged --quiet || git commit -m "Weekly blog posts + thumbnails: $(date +%Y-%m-%d)"
          git push
