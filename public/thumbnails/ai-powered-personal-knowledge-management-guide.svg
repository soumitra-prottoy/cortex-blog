<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="100" cy="120" r="200" fill="url(#accent)" opacity="0.08" />
  <circle cx="1100" cy="500" r="250" fill="url(#accent)" opacity="0.06" />
  <circle cx="600" cy="315" r="300" fill="#667eea" opacity="0.04" />

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="150" x2="1200" y2="150" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="white" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Brain/Notebook stylized graphic -->
  <g transform="translate(160, 180)">
    <!-- Brain outline -->
    <path d="M80 20 C40 20, 10 60, 10 100 C10 140, 40 180, 80 180 C120 180, 150 140, 150 100 C150 60, 120 20, 80 20"
          fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>
    <path d="M40 60 C60 50, 100 50, 120 60" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
    <path d="M35 90 C60 80, 100 80, 125 90" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
    <path d="M40 120 C60 110, 100 110, 120 120" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>

    <!-- Neural connections -->
    <circle cx="50" cy="70" r="4" fill="#667eea" opacity="0.8"/>
    <circle cx="110" cy="70" r="4" fill="#667eea" opacity="0.8"/>
    <circle cx="45" cy="100" r="4" fill="#667eea" opacity="0.8"/>
    <circle cx="115" cy="100" r="4" fill="#667eea" opacity="0.8"/>
    <circle cx="50" cy="130" r="4" fill="#667eea" opacity="0.8"/>
    <circle cx="110" cy="130" r="4" fill="#667eea" opacity="0.8"/>

    <line x1="50" y1="70" x2="110" y2="100" stroke="#764ba2" stroke-width="1.5" opacity="0.3"/>
    <line x1="110" y1="70" x2="45" y2="100" stroke="#764ba2" stroke-width="1.5" opacity="0.3"/>
    <line x1="45" y1="100" x2="115" y2="100" stroke="#764ba2" stroke-width="1.5" opacity="0.3"/>
    <line x1="115" y1="100" x2="50" y2="130" stroke="#764ba2" stroke-width="1.5" opacity="0.3"/>
    <line x1="50" y1="130" x2="110" y2="130" stroke="#764ba2" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Notebook graphic -->
  <g transform="translate(280, 220)">
    <rect x="0" y="0" width="120" height="160" rx="8" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
    <line x1="15" y1="35" x2="105" y2="35" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <line x1="15" y1="60" x2="105" y2="60" stroke="#667eea" stroke-width="1.5" opacity="0.3"/>
    <line x1="15" y1="80" x2="85" y2="80" stroke="#667eea" stroke-width="1.5" opacity="0.3"/>
    <line x1="15" y1="100" x2="105" y2="100" stroke="#667eea" stroke-width="1.5" opacity="0.3"/>
    <line x1="15" y1="120" x2="95" y2="120" stroke="#667eea" stroke-width="1.5" opacity="0.3"/>
    <!-- AI sparkle -->
    <circle cx="95" cy="20" r="12" fill="url(#accent)" opacity="0.6"/>
    <text x="95" y="24" text-anchor="middle" fill="white" font-size="12" font-family="system-ui">✦</text>
  </g>

  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="42">
    Build an AI-Powered
  </text>
  <text x="600" y="290" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="42">
    Knowledge System
  </text>

  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-weight="400" font-size="22">
    Stop losing good ideas. Start building a second brain.
  </text>

  <!-- Tags -->
  <g transform="translate(350, 380)">
    <rect x="0" y="0" width="110" height="32" rx="16" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1"/>
    <text x="55" y="21" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13">NotebookLM</text>

    <rect x="125" y="0" width="100" height="32" rx="16" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1"/>
    <text x="75" y="21" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13">Obsidian</text>

    <rect x="240" y="0" width="130" height="32" rx="16" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1"/>
    <text x="85" y="21" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13">Knowledge MGMT</text>

    <rect x="385" y="0" width="100" height="32" rx="16" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1"/>
    <text x="70" y="21" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="13">Productivity</text>
  </g>

  <!-- Author -->
  <text x="600" y="470" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">
    Cortex Team · June 19, 2026 · 14 min read
  </text>

  <!-- Bottom accent line -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accent)" opacity="0.8"/>
</svg>
